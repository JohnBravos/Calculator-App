<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator App</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div class="container">
        <div class="calculator">
            <div class="display">
                <input type="text" id="expression" value="" readonly >
                <input type="text" id="result" value="0" readonly >
            </div>
            <div class="buttons">
            <button class="sun"><i class="fa-solid fa-sun"></i></button>
            <button class="special"><i class="fa-solid fa-percent"></i></button>
            <button class="special"><i class="fa-solid fa-divide"></i></button>
            <button class="special"><i class="fa-solid fa-xmark"></i></button>
            <button >7</button>
            <button >8</button>
            <button >9</button>
            <button class="special"><i class="fa-solid fa-minus"></i></button>
            <button >4</button>
            <button >5</button>
            <button >6</button>
            <button class="special"><i class="fa-solid fa-plus"></i></button>
            <button >1</button>
            <button >2</button>
            <button >3</button>
            <button class="equals"><i class="fa-solid fa-equals"></i></button>
            <button class="ac">AC</button>
            <button >0</button>
            <button>.</button>
            </div>
        </div>
    </div>
    
    <script src="./script.js"></script>
</body>
</html>
